# Warehouse AMR 300 — the example from the TESR Robot Builder specification.
schema_version: 1
meta:
  name: warehouse_amr_300
  package_prefix: tesr_robot
  created_by: anon
  description: 300 kg differential-drive AMR for factory logistics
  tags: [amr, factory]

target:
  ros_distro: jazzy
  os: ubuntu-24.04
  compute: rpi5
  arch: arm64
  deployment: docker

requirements:
  application: amr
  environment: {type: factory, indoor: true, floor: concrete, max_slope_deg: 5, min_aisle_m: 1.2, max_door_width_m: 0.9}
  payload: {max_kg: 300, dims_m: [0.8, 0.6, 0.5], cog_offset_m: [0.0, 0.0, 0.25], load_type: rack}
  motion: {v_max: 1.0, a_max: 0.5, w_max: 1.0}
  runtime_h: 8

mechanical:
  dims_m: {length: 1.0, width: 0.7, height: 0.45, ground_clearance: 0.05}
  mass_kg: {robot: auto, total: auto}

drive:
  type: differential
  wheels: {diameter_m: 0.16, width_m: 0.05, separation_m: 0.60}
  casters:
    - {xyz: [0.40, 0.0, 0.0]}
    - {xyz: [-0.40, 0.0, 0.0]}
  motor: {hw: tesr_bldc_400w, count: 2, gear_ratio: 20, driver: tesr_md400}

hardware:
  - {id: lidar_front, hw: slamtec_p3, frame: lidar_front, parent: base_link, xyz: [0.35, 0.0, 0.40], rpy: [0.0, 0.0, 0.0]}
  - {id: imu, hw: tesr_imu, frame: imu_link, parent: base_link, xyz: [0.0, 0.0, 0.20], rpy: [0.0, 0.0, 0.0]}
  - {id: cam_front, hw: realsense_d455, frame: camera_link, parent: base_link, xyz: [0.45, 0.0, 0.30], rpy: [0.0, 0.0, 0.0]}
  - {id: motor_driver, hw: tesr_md400}
  - {id: encoders, hw: tesr_md400_encoder}
  - {id: estop, hw: generic_estop, io: DI1}

power:
  battery: {hw: lifepo4_48v_40ah}
  bus_v: 48
  rails:
    - {v: 5, hw: dcdc_48_5}
    - {v: 12, hw: dcdc_48_12}

io:
  DI: {1: estop, 2: bumper, 3: dock_sensor}
  DO: {1: tower_light, 2: buzzer}
comms: [dds, mqtt, rest]

ros:
  control: {stack: ros2_control, controller: auto}
  localization: {slam: slam_toolbox, amcl: true, ekf: auto}
  navigation:
    profile: indoor_amr
    planner: auto
    controller: auto
    costmap: auto
    safety_margin_m: 0.05
    features: [manual, slam, nav, waypoints]
  perception: {depth_to_costmap: true}

sim: {engine: gz_harmonic, world: warehouse_small, renderer: ogre1}
integrations: {node_red: true, studio_pro: true}
