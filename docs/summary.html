<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESR Robot Builder — สรุปสเปก &amp; ใบเสนอราคา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./logo.css">
<style>
  header.tesr nav .navsep { color:var(--muted); font-size:11.5px; margin:0 6px 0 4px; opacity:.7; }
  .bar-actions { position:sticky; top:0; z-index:5; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; padding:10px; background:rgba(7,7,10,.92); border-bottom:1px solid var(--line); }
  .sheet { max-width:980px; margin:18px auto 60px; background:#fbfaf7; color:#1b1b1f; border-radius:6px; padding:36px 42px; box-shadow:0 20px 60px rgba(0,0,0,.6); font-size:13.5px; }
  .sheet h1 { font-family:'Chakra Petch'; font-size:22px; margin:0; letter-spacing:.5px; }
  .sheet h2 { font-family:'Chakra Petch'; font-size:14px; letter-spacing:1px; text-transform:uppercase; color:#8B0000; margin:24px 0 8px; padding-bottom:4px; border-bottom:2px solid #8B0000; }
  .sheet .muted { color:#6d6a63; font-size:12px; }
  .doc-head { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; border-bottom:3px solid #1b1b1f; padding-bottom:14px; }
  .brand { display:flex; gap:12px; align-items:center; }
  .brand i { width:56px; height:56px; background:var(--logo) center/contain no-repeat; display:block; }
  .brand b { font-family:'Chakra Petch'; font-size:18px; display:block; } .brand span { font-size:12px; color:#6d6a63; }
  .doc-meta { text-align:right; } .doc-meta div { font-size:12.5px; } .doc-meta b { font-family:'Chakra Petch'; }
  .cust { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px 14px; margin-top:14px; }
  .cust label { color:#6d6a63; font-size:11.5px; }
  .cust input, .cust textarea { background:#fff; color:#1b1b1f; border:1px solid #d8d4ca; font-size:13px; padding:5px 7px; border-radius:4px; }
  .cust .wide { grid-column:1 / -1; }
  .hero { display:grid; grid-template-columns:1.25fr 1fr; gap:18px; margin-top:18px; align-items:stretch; }
  .hero .pic { background:#0a0a0f; border-radius:6px; overflow:hidden; display:grid; place-items:center; min-height:220px; color:#9a978f; font-size:12px; }
  .hero .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero .name { font-family:'Chakra Petch'; font-size:20px; } .hero .desc { color:#6d6a63; margin-bottom:10px; }
  .rankbox { display:flex; gap:12px; align-items:center; margin:6px 0 10px; }
  .rank { width:54px; height:60px; display:grid; place-items:center; font-family:'Chakra Petch'; font-size:30px; font-weight:700; color:#fff; background:#1b1b1f; clip-path:polygon(50% 0, 100% 22%, 100% 78%, 50% 100%, 0 78%, 0 22%); }
  .stat { margin:5px 0; } .stat .row { display:flex; justify-content:space-between; font-size:12px; } .stat b { font-family:'Chakra Petch'; }
  .bar { height:7px; background:#e5e1d8; border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; background:linear-gradient(90deg, #8B0000, #C9A84C); }
  .kv { width:100%; border-collapse:collapse; } .kv td { padding:5px 6px; border-bottom:1px solid #e5e1d8; vertical-align:top; } .kv td:first-child { color:#6d6a63; width:42%; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; }
  .grid2 h3 { font-size:12.5px; margin:10px 0 4px; color:#1b1b1f; }
  table.t { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.t th { text-align:left; background:#1b1b1f; color:#fff; padding:6px; font-weight:600; }
  table.t td { padding:6px; border-bottom:1px solid #e5e1d8; vertical-align:top; }
  table.t tr.cat td { background:#f1ede4; font-family:'Chakra Petch'; font-size:12px; color:#8B0000; letter-spacing:.4px; }
  table.t td.num, table.t th.num { text-align:right; white-space:nowrap; }
  table.t tfoot td { border:none; padding:4px 6px; } table.t tfoot tr.grand td { font-family:'Chakra Petch'; font-size:16px; border-top:2px solid #1b1b1f; padding-top:8px; }
  .sheet a { color:#8B0000; }
  .note { font-size:12px; color:#6d6a63; }
  .wi { padding:5px 8px; margin:4px 0; border-left:3px solid #c98b1e; background:#fff8ea; font-size:12.5px; } .wi.err { border-color:#c0392b; background:#fdeeee; } .wi.ok { border-color:#2e8b57; background:#eef8f1; }
  .sign { display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:40px; } .sign div { border-top:1px solid #1b1b1f; padding-top:6px; text-align:center; font-size:12px; color:#6d6a63; }
  .opts { display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:12.5px; margin:6px 0; }
  .opts input[type=number] { width:70px; background:#fff; color:#1b1b1f; border:1px solid #d8d4ca; }
  .empty { max-width:620px; margin:60px auto; text-align:center; }
  @media (max-width:760px) { .sheet { padding:20px 16px; } .hero, .grid2, .cust { grid-template-columns:1fr; } }
  @media print {
    @page { size:A4; margin:12mm; }
    body { background:#fff !important; } body::before { display:none; }
    header.tesr, .bar-actions, footer.tesr, .no-print { display:none !important; }
    .sheet { box-shadow:none; margin:0; padding:0; max-width:none; }
    .cust input, .cust textarea { border:none; padding:0; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    h2 { break-after:avoid; } tr, .hero { break-inside:avoid; }
  }
</style>
</head>
