<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESR Robot Builder — ① ออกแบบหุ่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./logo.css">
<link rel="stylesheet" href="./garage.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head>
<body class="garage-body mode-design">
<header class="tesr">
  <h1>TESR <span>Robot Builder</span></h1>
  <nav data-step="design"><a class="active" href="./index.html">① ออกแบบ</a><a href="./play.html">② ทดสอบ &amp; เกม</a><a href="./summary.html">③ สรุป &amp; ราคา</a><a href="./build.html">④ ส่งออก ROS 2</a><a href="./guide.html">📘 คู่มือ</a></nav>
  <div class="status" id="gStatus">กำลังเปิดโรงรถ…</div>
</header>
<main class="garage">
  <aside class="panel-g" id="bay">
    <div class="wz-head" id="tabs"></div>
    <div class="scroll" id="tabBody"></div>
    <div class="foot" id="wzFoot"></div>
  </aside>
  <section class="stage">
    <div id="viewport"></div>
    <div class="stage-top">
      <div class="callsign"><small>ชื่อหุ่น</small><input id="robotName" spellcheck="false" maxlength="40"><div class="sub" id="robotSub"></div></div>
      <div class="rank" id="rank" data-rank="B"><small>RANK</small>B</div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="stage-tools" id="tools">
      <button data-tool="scan" class="on" title="แสดงระยะสแกน LiDAR / กล้อง">📡 ระยะสแกน</button>
      <button data-tool="xray" title="มองทะลุตัวถัง">🩻 มองทะลุ</button>
      <button data-tool="payload" class="on" title="แสดงของที่บรรทุก">📦 ของ</button>
      <button data-tool="spin" title="หมุนโชว์">🔄 โชว์</button>
      <button data-tool="drive" title="ทดลองขับ W A S D">🎮 ขับ</button>
      <button data-tool="fit" title="จัดมุมกล้อง">🎯 จัดมุม</button>
      <button data-tool="shot" title="บันทึกภาพ">📸 ภาพ</button>
      <button data-tool="lite" title="ปิด bloom/เงา สำหรับเครื่องที่ช้า">⚡ โหมดเบา</button>
    </div>
    <div class="loading" id="loading">BOOTING GARAGE…</div>
  </section>
  <aside class="panel-g" id="hud">
    <div class="scroll">
      <div class="insp" id="inspector" hidden></div>
      <h2>ภาพรวมหุ่น</h2>
      <div id="overview"></div>
      <div id="warnings"></div>
      <details class="adv" id="advStats"><summary>ค่าคำนวณละเอียด</summary><div id="stats"></div><div class="numgrid" id="numbers"></div></details>
      <details class="adv" id="advBom"><summary id="bomSum">รายการอุปกรณ์</summary><div id="bomMini"></div></details>
      <details class="adv" id="advFiles"><summary>ดาวน์โหลดไฟล์ / เซฟงาน</summary>
        <div class="exports">
          <button class="wide" id="exZip">📦 แพ็กเกจ ROS 2 (RViz + Gazebo) .zip</button>
          <button id="exYaml">📄 robot.yaml</button>
          <button id="exUrdf">🤖 URDF</button>
          <button id="exBom">🧾 BOM (CSV)</button>
          <button id="exPng">🖼 ภาพ PNG</button>
          <button id="exSave">💾 เซฟงาน</button>
          <button id="exLoad">📂 เปิดงาน</button>
        </div>
        <p class="note"><a href="./guide.html" style="color:var(--gold)">📘 วิธีนำไฟล์ไปใช้กับ ROS 2</a></p>
      </details>
    </div>
    <div class="foot cta-stack" style="display:grid">
      <button class="quiet" id="exSummary">ข้ามไปขั้น 3 · สรุป &amp; ราคา →</button>
      <a class="quiet" href="./play.html" id="toPlay">🎮 ลองขับ / เล่นเกมกับหุ่นตัวนี้</a>
      <button class="quiet" id="exBuild" hidden>④ ส่งออก ROS 2</button>
    </div>
  </aside>
</main>
<input type="file" id="shellInput" accept=".stl,.STL" hidden>
<input type="file" id="partInput" accept=".stl,.STL" hidden>
<input type="file" id="saveInput" accept=".json" hidden>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="./garage-core.js"></script>
<script type="module" src="./garage.js"></script>
<script type="module" src="./garage-ux.js"></script>
<script src="./nav.js"></script>
<script src="./i18n.js"></script>
</body>
</html>
