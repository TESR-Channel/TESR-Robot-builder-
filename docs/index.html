<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESR Robot Builder — Garage 3D · ประกอบหุ่นยนต์ในเบราว์เซอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./logo.css">
<style>
  body.garage-body { overflow:hidden; }
  main.garage { display:grid; grid-template-columns:340px minmax(0, 1fr) 330px; gap:10px; padding:10px; height:calc(100vh - 74px); }
  @media (max-width:1150px) { body.garage-body { overflow:auto; } main.garage { grid-template-columns:1fr; height:auto; } .stage { height:72vh; } }
  .sci { position:relative; overflow:auto; padding:14px; border:1px solid rgba(201,168,76,.22);
    background:linear-gradient(180deg, rgba(22,22,28,.96), rgba(10,10,14,.96));
    clip-path:polygon(0 14px, 14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .sci h2 { font-family:'Chakra Petch'; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .sci h2::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, rgba(201,168,76,.5), transparent); }
  .sci h2:first-child { margin-top:0; }
  .tabs { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; margin-bottom:6px; }
  .tabs button { background:#101014; border:1px solid var(--line); border-radius:8px; font-size:11.5px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--muted); }
  .tabs button .ic { font-size:18px; filter:grayscale(.6); }
  .tabs button.on { border-color:var(--gold); color:var(--gold); background:linear-gradient(180deg, rgba(201,168,76,.14), #101014); box-shadow:0 0 14px rgba(201,168,76,.18) inset; }
  .tabs button.on .ic { filter:none; }
  .pcard { position:relative; display:grid; grid-template-columns:42px 1fr; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#0d0d11; margin:6px 0; cursor:pointer; transition:.15s; }
  .pcard:hover { border-color:rgba(233,200,106,.7); transform:translateX(2px); }
  .pcard.on { border-color:var(--gold); background:linear-gradient(90deg, rgba(201,168,76,.13), #0d0d11 70%); box-shadow:0 0 18px rgba(201,168,76,.12); }
  .pcard.on::before { content:'✔ เลือกอยู่'; position:absolute; right:8px; top:6px; font-size:10.5px; color:var(--gold); }
  .pcard.locked { opacity:.45; cursor:not-allowed; } .pcard.locked::before { content:'🔒 เร็ว ๆ นี้'; position:absolute; right:8px; top:6px; font-size:10.5px; color:var(--muted); }
  .pcard .ico { width:42px; height:42px; border-radius:9px; display:grid; place-items:center; font-size:21px; background:radial-gradient(circle at 30% 25%, #2b2b35, #0e0e12); border:1px solid #2a2a31; }
  .pcard b { font-size:13px; display:block; padding-right:70px; line-height:1.3; }
  .pcard .spec { font-size:11.5px; color:var(--muted); }
  .chips { margin-top:3px; display:flex; flex-wrap:wrap; gap:4px; }
  .chips span, .chips a { font-size:10.5px; padding:0 7px; border-radius:9px; border:1px solid var(--line); color:var(--muted); text-decoration:none; }
  .chips .ok { color:#7fd39b; border-color:var(--ok); } .chips .warn { color:#e9b45a; border-color:var(--warn); } .chips .err { color:#ff8a80; border-color:var(--err); }
  .chips .price { color:var(--gold); border-color:rgba(201,168,76,.5); } .chips a:hover { color:#000; background:var(--gold); }
  .pcard .go { position:absolute; right:8px; bottom:8px; font-size:11.5px; padding:2px 9px; }
  .bp { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .bp .pcard { grid-template-columns:1fr; text-align:center; margin:0; padding:10px 8px; }
  .bp .pcard .ico { margin:0 auto; width:48px; height:48px; font-size:25px; }
  .bp .pcard b { padding:0; }
  .sl { margin:9px 0; } .sl .row { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); }
  .sl .val { color:var(--gold); font-family:'Chakra Petch'; }
  .sl input[type=range] { width:100%; accent-color:var(--gold); background:transparent; border:none; padding:0; }
  .seg { display:flex; gap:5px; flex-wrap:wrap; margin:6px 0; }
  .seg button { background:#101014; border:1px solid var(--line); font-size:12px; padding:5px 10px; border-radius:18px; color:var(--text); }
  .seg button.on { border-color:var(--gold); color:#1a1300; background:linear-gradient(180deg, var(--gold-2), var(--gold)); }
  .sw { width:26px; height:26px; border-radius:50%; border:2px solid #333; cursor:pointer; padding:0; }
  .sw.on { border-color:var(--gold); box-shadow:0 0 10px rgba(201,168,76,.7); }
  .installed { display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px; border:1px solid var(--line); border-radius:7px; margin:4px 0; cursor:pointer; background:#0d0d11; }
  .installed.sel { border-color:var(--gold); } .installed .nm { flex:1; } .installed button { padding:1px 7px; font-size:11px; background:#26262c; }
  .note { font-size:12px; color:var(--muted); margin:6px 0; }
  .stage { position:relative; border-radius:14px; overflow:hidden; border:1px solid rgba(201,168,76,.28); background:#05050a; }
  #viewport { position:absolute; inset:0; } #viewport canvas { display:block; width:100%; height:100%; }
  .stage::after { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
  .stage-top { position:absolute; left:14px; right:14px; top:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:2; }
  .callsign { pointer-events:auto; background:rgba(8,8,12,.72); border:1px solid rgba(201,168,76,.4); padding:6px 12px; clip-path:polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%); }
  .callsign small { display:block; font-family:'Chakra Petch'; letter-spacing:3px; color:var(--gold); font-size:10px; }
  .callsign input { background:transparent; border:none; outline:none; font-family:'Chakra Petch'; font-size:19px; color:#fff; padding:0; width:250px; }
  .callsign .sub { font-size:11.5px; color:var(--muted); }
  .rank { width:78px; height:88px; display:grid; place-items:center; align-content:center; font-family:'Chakra Petch'; font-size:40px; font-weight:700; line-height:1; color:var(--gold); background:rgba(8,8,12,.75);
    clip-path:polygon(50% 0, 100% 22%, 100% 78%, 50% 100%, 0 78%, 0 22%); text-shadow:0 0 18px rgba(201,168,76,.9); border:none; position:relative; }
  .rank small { font-size:10px; letter-spacing:3px; color:var(--muted); text-shadow:none; }
  .rank[data-rank="S"] { color:#ffe58a; } .rank[data-rank="C"], .rank[data-rank="D"] { color:#ff6b5e; text-shadow:0 0 18px rgba(255,80,60,.8); }
  .stage-tools { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:5px; background:rgba(8,8,12,.78); padding:6px; border:1px solid rgba(201,168,76,.3); border-radius:12px; z-index:2; flex-wrap:wrap; justify-content:center; max-width:94%; }
  .stage-tools button { background:#16161c; font-size:12px; padding:6px 11px; border-radius:8px; }
  .stage-tools button.on { background:linear-gradient(180deg, var(--gold-2), var(--gold)); color:#1a1300; font-weight:600; }
  .banner { position:absolute; top:112px; left:50%; transform:translateX(-50%); background:linear-gradient(90deg, rgba(139,0,0,.92), rgba(179,23,27,.92)); padding:7px 16px; border-radius:20px; font-size:13px; z-index:2; box-shadow:0 0 22px rgba(179,23,27,.5); white-space:nowrap; }
  .loading { position:absolute; inset:0; display:grid; place-items:center; font-family:'Chakra Petch'; letter-spacing:5px; color:var(--gold); background:#05050a; z-index:5; }
  .stat { margin:9px 0; } .stat .row { display:flex; justify-content:space-between; font-size:12.5px; } .stat .row b { font-family:'Chakra Petch'; color:var(--gold); font-weight:500; }
  .bar { height:9px; background:#18181e; border-radius:5px; overflow:hidden; position:relative; margin-top:3px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--crimson), var(--crimson-2) 40%, var(--gold)); box-shadow:0 0 12px rgba(201,168,76,.55); transition:width .45s; }
  .bar::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 9%, rgba(0,0,0,.65) 9% 10%); }
  .numgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .numgrid div { background:#0d0d11; border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  .numgrid b { display:block; font-family:'Chakra Petch'; color:var(--gold); font-size:15px; font-weight:500; } .numgrid span { font-size:11px; color:var(--muted); }
  .wi { font-size:12.5px; padding:6px 9px; border-left:3px solid var(--line); margin:5px 0; background:#0d0d11; border-radius:0 6px 6px 0; }
  .wi.err { border-color:var(--err); } .wi.warn { border-color:var(--warn); } .wi.ok { border-color:var(--ok); }
  .exports { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .exports button { font-size:12.5px; padding:8px 6px; } .exports .wide { grid-column:1 / -1; }
  .bl { display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:12px; border-bottom:1px solid var(--line); padding:5px 0; }
  .bl .q { color:var(--gold); font-family:'Chakra Petch'; min-width:22px; } .bl .n { flex:1; }
  .bl a { color:var(--gold); text-decoration:none; font-size:11.5px; white-space:nowrap; }
  .insp .grid4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; } .insp label { font-size:11px; } .insp input { width:100%; padding:4px 6px; font-size:12.5px; }
  header.tesr nav .navsep { color:var(--muted); font-size:11.5px; margin:0 6px 0 4px; opacity:.7; }
  kbd { font-family:'Chakra Petch'; font-size:11px; border:1px solid #444; border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--text); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head>
<body class="garage-body">
<header class="tesr">
  <h1>TESR <span>Robot Builder</span></h1>
  <nav><a class="active" href="./index.html">1 · 🛠 Garage 3D</a><a href="./summary.html">2 · 📋 สรุปสเปก &amp; ใบเสนอราคา</a><a href="./build.html">3 · ⚙️ สร้าง ROS 2 workspace</a><span class="navsep">เครื่องมือ:</span><a href="./form.html">โหมดฟอร์ม</a><a href="./model.html">เปิด URDF/STL</a></nav>
  <div class="status" id="gStatus">กำลังเปิดโรงรถ…</div>
</header>
<main class="garage">
  <aside class="sci" id="bay">
    <div class="tabs" id="tabs">
      <button data-tab="mission" class="on"><span class="ic">🎯</span>โจทย์งาน</button>
      <button data-tab="chassis"><span class="ic">🧱</span>โครง</button>
      <button data-tab="drive"><span class="ic">🛞</span>ขับเคลื่อน</button>
      <button data-tab="sensors"><span class="ic">📡</span>เซนเซอร์</button>
      <button data-tab="power"><span class="ic">🔋</span>พลังงาน</button>
      <button data-tab="brain"><span class="ic">🧠</span>สมอง</button>
      <button data-tab="parts"><span class="ic">🧩</span>ชิ้นส่วน</button>
      <button data-tab="help"><span class="ic">❔</span>วิธีเล่น</button>
    </div>
    <div id="tabBody"></div>
  </aside>

  <section class="stage">
    <div id="viewport"></div>
    <div class="stage-top">
      <div class="callsign"><small>CALLSIGN</small><input id="robotName" spellcheck="false" maxlength="40"><div class="sub" id="robotSub"></div></div>
      <div class="rank" id="rank" data-rank="B"><small>RANK</small>B</div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="stage-tools" id="tools">
      <button data-tool="scan" class="on" title="แสดงระยะสแกน LiDAR / กล้อง">📡 สแกน</button>
      <button data-tool="xray" title="มองทะลุตัวถัง">🩻 X-Ray</button>
      <button data-tool="payload" class="on" title="แสดงของที่บรรทุก">📦 ของ</button>
      <button data-tool="spin" title="หมุนโชว์">🔄 โชว์</button>
      <button data-tool="drive" title="ทดลองขับ W A S D">🎮 ทดลองขับ</button>
      <button data-tool="fit" title="จัดมุมกล้อง">🎯 มุมกล้อง</button>
      <button data-tool="shot" title="บันทึกภาพ">📸 ภาพ</button>
      <button data-tool="lite" title="ปิด bloom/เงา สำหรับเครื่องที่ช้า">⚡ โหมดเบา</button>
    </div>
    <div class="loading" id="loading">BOOTING GARAGE…</div>
  </section>

  <aside class="sci" id="hud">
    <h2>สเตตัสหุ่น</h2>
    <div id="stats"></div>
    <div class="numgrid" id="numbers"></div>
    <div class="insp" id="inspector" hidden></div>
    <h2>แจ้งเตือน</h2>
    <div id="warnings"></div>
    <h2>ส่งออก / ไปต่อ</h2>
    <div class="exports">
      <button class="gold wide" id="exSummary">📋 สรุปสเปก &amp; ใบเสนอราคา (ขั้น 2) →</button>
      <button class="wide" id="exBuild">🚀 สร้าง ROS 2 workspace (ขั้น 3)</button>
      <button class="wide" id="exZip">📦 ROS 2 Jazzy package — RViz + Gazebo (.zip)</button>
      <button class="ghost" id="exYaml">📄 robot.yaml</button>
      <button class="ghost" id="exUrdf">🤖 URDF</button>
      <button class="ghost" id="exBom">🧾 BOM (CSV)</button>
      <button class="ghost" id="exPng">🖼 ภาพ PNG</button>
      <button class="ghost" id="exSave">💾 เซฟโรงรถ</button>
      <button class="ghost" id="exLoad">📂 โหลดเซฟ</button>
    </div>
    <h2>รายการสั่งซื้อ · TESR Shop</h2>
    <div id="bomMini"></div>
  </aside>
</main>
<input type="file" id="shellInput" accept=".stl,.STL" hidden>
<input type="file" id="partInput" accept=".stl,.STL" hidden>
<input type="file" id="saveInput" accept=".json" hidden>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="./garage-core.js"></script>
<script type="module" src="./garage.js"></script>
<script type="module" src="./garage-game.js"></script>
<script type="module" src="./garage-ux.js"></script>
</body>
</html>
