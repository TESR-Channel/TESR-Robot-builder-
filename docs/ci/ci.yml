name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: schema · calc · rules · generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Validate every example
        run: |
          for f in examples/*.robot.yaml; do tesr-rb validate "$f" --hide-pass; done
      - name: Web data is in sync with registry + catalog
        run: |
          tesr-rb export-web -o /tmp/webdata
          python3 - <<'PY'
          import json, pathlib
          a, b = pathlib.Path("docs/data"), pathlib.Path("/tmp/webdata")
          assert json.loads((a/"registry.json").read_text()) == json.loads((b/"registry.json").read_text()), "docs/data/registry.json is stale — run tesr-rb export-web"
          assert (a/"products.csv").read_text().strip() == (b/"products.csv").read_text().strip(), "docs/data/products.csv is stale — run tesr-rb export-web"
          assert json.loads((a/"engine-manifest.json").read_text())["files"] == json.loads((b/"engine-manifest.json").read_text())["files"], "docs/data/engine-manifest.json is stale — run tesr-rb export-web"
          PY

  colcon:
    name: colcon build (ros:jazzy-ros-base)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TESR Robot Builder
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # The ROS apt key in older ros:* images has expired; refresh the ROS apt source package first so apt-get update cannot fail on it.
          rm -f /etc/apt/sources.list.d/ros2*.list /etc/apt/sources.list.d/ros2*.sources || true
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates python3-pip git liburdfdom-tools
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          ver=$(curl -fsSL https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F '"tag_name"' | awk -F'"' '{print $4}')
          curl -fsSL -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ver}/ros2-apt-source_${ver}.${codename}_all.deb"
          dpkg -i /tmp/ros2-apt-source.deb
          apt-get update -qq
          # these two live in the ROS apt repo, so they can only be installed after the ROS source is back
          apt-get install -y -qq --no-install-recommends python3-colcon-common-extensions python3-rosdep python3-vcstool
          # do NOT upgrade pip here: the image's pip comes from a Debian package and cannot be uninstalled by pip
          python3 -m pip install --break-system-packages --no-cache-dir ".[dev]"
          tesr-rb --help > /dev/null
      - name: Generate a workspace from every example
        shell: bash
        run: |
          set -euo pipefail
          for f in examples/*.robot.yaml; do
            n=$(basename "$f" .robot.yaml)
            tesr-rb generate "$f" -o "build/ws_$n"
          done
      - name: rosdep + colcon build
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          for ws in build/ws_*; do
            echo "::group::$ws"
            pushd "$ws"
            rosdep install --from-paths src -y --ignore-src --rosdistro jazzy --skip-keys "rviz2 joint_state_publisher_gui"
            colcon build --symlink-install --event-handlers console_cohesion+
            popd
            echo "::endgroup::"
          done
      - name: xacro + check_urdf on every generated model
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          for ws in build/ws_*; do
            source "$ws/install/setup.bash"
            for x in "$ws"/src/*_description/urdf/robot.urdf.xacro; do
              xacro "$x" > /tmp/robot.urdf
              check_urdf /tmp/robot.urdf
            done
          done
