name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: schema · calc · rules · generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Validate every example
        run: |
          for f in examples/*.robot.yaml; do tesr-rb validate "$f" --hide-pass; done
      - name: Web data is in sync with registry + catalog
        run: |
          tesr-rb export-web -o /tmp/webdata
          python3 - <<'PY'
          import json, pathlib
          a, b = pathlib.Path("docs/data"), pathlib.Path("/tmp/webdata")
          assert json.loads((a/"registry.json").read_text()) == json.loads((b/"registry.json").read_text()), "docs/data/registry.json is stale — run tesr-rb export-web"
          assert (a/"products.csv").read_text().strip() == (b/"products.csv").read_text().strip(), "docs/data/products.csv is stale — run tesr-rb export-web"
          assert json.loads((a/"engine-manifest.json").read_text())["files"] == json.loads((b/"engine-manifest.json").read_text())["files"], "docs/data/engine-manifest.json is stale — run tesr-rb export-web"
          PY

  colcon:
    name: colcon build (ros:jazzy-ros-base)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install TESR Robot Builder
        shell: bash
        run: |
          set -euxo pipefail
          trap 'echo "::error title=Install::line $LINENO: $BASH_COMMAND"' ERR
          export DEBIAN_FRONTEND=noninteractive
          # Old ros:* images ship an expired ROS apt key; only then reinstall the ROS apt source.
          # The release version comes from the github.com redirect (no API call, so no API rate limit).
          if ! apt-get update -qq; then
            echo "::warning::ROS apt source broken (expired key?) - reinstalling ros2-apt-source"
            rm -f /etc/apt/sources.list.d/ros2*
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            ver=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ros-infrastructure/ros-apt-source/releases/latest | sed 's#.*/tag/##')
            curl -fsSL -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ver}/ros2-apt-source_${ver}.${codename}_all.deb"
            dpkg -i /tmp/ros2-apt-source.deb
            apt-get update -qq
          fi
          apt-get install -y -qq --no-install-recommends ca-certificates git liburdfdom-tools \
            python3-colcon-common-extensions python3-rosdep python3-vcstool python3-venv
          # The engine gets its own venv: pip cannot upgrade the image's Debian-packaged Python libs
          # (typing_extensions, PyYAML, pip itself: "RECORD file not found"), and ROS tools keep the system Python untouched.
          python3 -m venv /opt/tesr-rb
          /opt/tesr-rb/bin/pip install --no-cache-dir .
          ln -sf /opt/tesr-rb/bin/tesr-rb /usr/local/bin/tesr-rb
          tesr-rb --help > /dev/null
      - name: Generate a workspace from every example
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Generate::line $LINENO: $BASH_COMMAND"' ERR
          for f in examples/*.robot.yaml; do
            n=$(basename "$f" .robot.yaml)
            tesr-rb generate "$f" -o "build/ws_$n"
          done
      - name: rosdep + colcon build
        shell: bash
        run: |
          set -eo pipefail   # no -u: ROS setup.bash reads unset variables
          trap 'echo "::error title=rosdep/colcon::line $LINENO: $BASH_COMMAND (ws=${ws:-})"' ERR
          source /opt/ros/jazzy/setup.bash
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          for ws in build/ws_*; do
            echo "::group::$ws"
            pushd "$ws"
            rosdep install --from-paths src -y --ignore-src --rosdistro jazzy --skip-keys "rviz2 joint_state_publisher_gui"
            colcon build --symlink-install --event-handlers console_cohesion+
            popd
            echo "::endgroup::"
          done
      - name: xacro (mock / sim / real) + check_urdf + launch files load
        shell: bash
        run: |
          set -eo pipefail
          trap 'echo "::error title=Model/launch check::line $LINENO: $BASH_COMMAND"' ERR
          source /opt/ros/jazzy/setup.bash
          for ws in build/ws_*; do
            source "$ws/install/setup.bash"
            for x in "$ws"/src/*_description/urdf/robot.urdf.xacro; do
              for hw in mock sim real; do
                echo "::group::$x hardware:=$hw"
                xacro "$x" hardware:=$hw > /tmp/robot.urdf
                check_urdf /tmp/robot.urdf
                echo "::endgroup::"
              done
            done
            for pkg in $(ls "$ws/src"); do
              for lf in "$ws/src/$pkg"/launch/*.launch.py; do
                [ -f "$lf" ] || continue
                echo "--- ros2 launch $pkg $(basename "$lf") --show-args"
                ros2 launch "$pkg" "$(basename "$lf")" --show-args > /dev/null
              done
            done
          done
