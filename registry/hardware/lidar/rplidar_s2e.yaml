id: rplidar_s2e
category: lidar
name: Slamtec RPLIDAR S2E (2D ToF, 30 m, Ethernet)
manufacturer: Slamtec
mass_kg: 0.19
dims_m: [0.077, 0.077, 0.0389]
electrical: {voltage_v: 12, typical_w: 2.4, peak_w: 3.0}
